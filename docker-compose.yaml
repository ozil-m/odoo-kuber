services:

  db:
    image: postgres:15
    container_name: odoo18-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo

    volumes:
      - odoo18-db-data:/var/lib/postgresql/data

  odoo:
    build:
      context: .
      dockerfile: Dockerfile

    image: ozil-m/odoo18:latest
    container_name: odoo18
    restart: unless-stopped

    depends_on:
      - db

    ports:
      - "8069:8069"

    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo

    volumes:
      - odoo18-web-data:/var/lib/odoo

volumes:
  odoo18-db-data:
  odoo18-web-data:
